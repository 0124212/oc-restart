name: build-all

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ─── iOS (unsigned IPA) ──────────────────────────────────
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --release --no-codesign
      - run: |
          cd build/ios/iphoneos
          rm -rf Payload oc_restart-unsigned.ipa
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qry oc_restart-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/iphoneos/oc_restart-unsigned.ipa

  # ─── watchOS (needs Xcode project — placeholder) ─────────
  watchos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "watchOS requires an Xcode project with WatchKit target."
          echo "Source files are in watchos/OcRestartWatch/."
          echo "To build: create Xcode project, add Swift files, archive for watchOS."

  # ─── Android APK ─────────────────────────────────────────
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ─── Linux desktop ───────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev pkg-config
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: build/linux/x64/release/bundle/

  # ─── Windows ─────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/windows/x64/runner/Release/
