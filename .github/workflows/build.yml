# Builds oc_restart for iOS (unsigned IPA for sideloading/TestFlight upload)
# + Android APK. iOS CANNOT build on Linux — Apple requires macOS + Xcode,
# so this runs on a macOS runner. Push to GitHub and it builds automatically.
name: build-ios-android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Unsigned IPA: Xcode can't export an .ipa without signing, so we
      # package Runner.app into a Payload zip ourselves. Install the
      # result via AltStore / Sideloadly, or re-sign for TestFlight.
      - run: flutter build ios --release --no-codesign
      - run: |
          cd build/ios/iphoneos
          rm -rf Payload oc_restart-unsigned.ipa
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qry oc_restart-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/iphoneos/oc_restart-unsigned.ipa

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
